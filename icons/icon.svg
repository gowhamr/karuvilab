<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="KaruviLab logo">
  <defs>
    <!-- Brand gradient: medium blue → deep navy (matches uploaded mark) -->
    <linearGradient id="kl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3B82F6"/>
      <stop offset="55%"  stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="kl-grad-arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <!-- Subtle inner gleam on the K edge -->
    <linearGradient id="kl-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square plate (same brand chip used in app shell) -->
  <rect width="192" height="192" rx="38" fill="#0F172A"/>
  <rect width="192" height="192" rx="38" fill="url(#kl-grad)" opacity=".18"/>

  <!-- K mark — three pieces shaped like the uploaded logo -->
  <!-- Vertical stem -->
  <path d="M44 30 L74 30 L74 162 L44 162 Z" fill="url(#kl-grad)"/>
  <!-- Upper arm (folded triangle) -->
  <path d="M74 96 L138 30 L160 30 L96 96 Z" fill="url(#kl-grad-arm)"/>
  <!-- Lower arm (anchored on the gear) -->
  <path d="M96 96 L160 162 L138 162 L74 96 Z" fill="url(#kl-grad-arm)"/>

  <!-- Subtle highlight along stem -->
  <rect x="44" y="30" width="30" height="132" fill="url(#kl-edge)"/>

  <!-- Wrench, anchored over the K crossbar -->
  <g fill="#FFFFFF" opacity=".95">
    <!-- Wrench shaft -->
    <rect x="92" y="74" width="10" height="58" rx="3"/>
    <!-- Wrench open-end head (top) -->
    <path d="M82 60 a16 16 0 0 1 30 0 l-4 6 a10 10 0 0 0 -22 0 z"/>
  </g>

  <!-- Gear at bottom-right, partially behind the lower arm -->
  <g fill="#FFFFFF" opacity=".88">
    <circle cx="148" cy="138" r="14"/>
    <g>
      <rect x="144" y="118" width="8"  height="6"  rx="1.5"/>
      <rect x="144" y="152" width="8"  height="6"  rx="1.5"/>
      <rect x="128" y="134" width="6"  height="8"  rx="1.5"/>
      <rect x="162" y="134" width="6"  height="8"  rx="1.5"/>
    </g>
    <circle cx="148" cy="138" r="5" fill="#1E3A8A"/>
  </g>
</svg>
