<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Converter — KaruviLab</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="stylesheet" href="../../css/style.css" />
  <script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();</script>
  <script>window.SHELL_ACTIVE = 'image-converter';</script>
</head>
<body>
  <div class="panel tool-panel active" id="panel-converter">
    <div class="panel-nav">
      <div class="nav-back" onclick="Shell.goHome()" role="button" tabindex="0" aria-label="Go home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div class="nav-head">
        <p class="nav-title">Image Converter</p>
        <p class="nav-subtitle">Convert between JPG, PNG, and WebP instantly</p>
      </div>
    </div>

    <div class="panel-scroll">
      <nav class="breadcrumb-nav">
        <a href="../../">Home</a> <span class="breadcrumb-sep">&rsaquo;</span> 
        <a href="../../image-tools/">Image Tools</a> <span class="breadcrumb-sep">&rsaquo;</span> 
        <span class="current">Image Converter</span>
      </nav>

      <div class="tool-section">
        <div class="upload-zone" id="convert-drop">
          <div class="upload-icon-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </div>
          <p class="upload-main">Upload Images</p>
          <p class="upload-sub"><label for="convert-input" class="link">Select files</label> or drag here</p>
          <p class="upload-formats">JPG &middot; PNG &middot; WebP &middot; HEIC &middot; TIFF &middot; BMP</p>
          <input type="file" id="convert-input" accept="image/*" multiple hidden />
        </div>

        <div id="convert-settings" style="display:none; margin-top:24px;">
          <div class="settings-card">
            <p class="settings-card-title">Conversion Settings</p>
            <div class="settings-row">
              <span class="settings-label">Convert to</span>
              <select id="convert-format" class="workspace-input">
                <option value="png">PNG (Lossless)</option>
                <option value="jpg">JPG (Standard)</option>
                <option value="webp">WebP (Modern)</option>
                <option value="avif">AVIF (Ultra-small)</option>
                <option value="bmp">BMP (Raw)</option>
              </select>
            </div>
            <div class="slider-row" id="quality-row">
              <div class="slider-header">
                <span class="slider-label">Output Quality</span>
                <span class="slider-val" id="quality-val">90%</span>
              </div>
              <input type="range" id="convert-quality" min="10" max="100" value="90" aria-label="Output Quality" aria-valuemin="10" aria-valuemax="100" aria-valuenow="90" />
            </div>
          </div>

          <div class="panel-cta-bar" style="position:static;padding:0;margin-top:20px">
            <button class="panel-cta-btn" id="convert-btn" style="width:100%">
              Convert & Download
            </button>
          </div>
        </div>

        <div class="file-list" id="convert-file-list" style="margin-top:24px"></div>
        <div class="results-area" id="convert-results" style="margin-top:24px"></div>
      </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <!-- Scripts -->
  <script src="../../js/shell.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/format-utils.js"></script>
  <script src="../../js/image-tools.js"></script>
  <script src="../../js/app.js"></script>

  <script>
    (function() {
      const dropZone = document.getElementById('convert-drop');
      const fileInput = document.getElementById('convert-input');
      const settingsArea = document.getElementById('convert-settings');
      const convertBtn = document.getElementById('convert-btn');
      const fileList = document.getElementById('convert-file-list');
      const resultsArea = document.getElementById('convert-results');
      const formatSelect = document.getElementById('convert-format');
      const qualityRow = document.getElementById('quality-row');
      const qualityInput = document.getElementById('convert-quality');
      const qualityVal = document.getElementById('quality-val');

      let currentFiles = [];

      function updateUI() {
        fileList.innerHTML = '';
        currentFiles.forEach((file, idx) => {
          fileList.appendChild(FormatUtils.createFileCard(file, () => {
            currentFiles.splice(idx, 1);
            updateUI();
          }));
        });

        settingsArea.style.display = currentFiles.length ? 'block' : 'none';
        if (!currentFiles.length) resultsArea.innerHTML = '';
      }

      async function handleFiles(files) {
        if (!files.length) return;
        
        for (const file of files) {
          if (FormatUtils.isImage(file)) {
            currentFiles.push(file);
          } else {
            Shell.toast(`${file.name} is not a supported image.`, 'error');
          }
        }
        updateUI();
      }

      Utils.setupDropZone(dropZone, fileInput, handleFiles);

      formatSelect.onchange = () => {
        const fmt = formatSelect.value;
        qualityRow.style.display = (fmt === 'png' || fmt === 'bmp') ? 'none' : 'block';
      };

      qualityInput.oninput = () => {
        qualityVal.innerText = qualityInput.value + '%';
        qualityInput.setAttribute('aria-valuenow', qualityInput.value);
      };

      convertBtn.onclick = async () => {
        if (!currentFiles.length) return;

        convertBtn.disabled = true;
        convertBtn.innerHTML = Utils.spinnerHTML() + ' Converting...';
        resultsArea.innerHTML = '';

        const targetFmt = formatSelect.value;
        const quality = parseInt(qualityInput.value) / 100;

        let successCount = 0;
        for (const file of currentFiles) {
          try {
            const result = await ImageTools.convert(file, targetFmt, quality);
            const outName = Utils.replaceExt(file.name, targetFmt);
            resultsArea.appendChild(FormatUtils.createResultCard(outName, result.blob));
            successCount++;
          } catch (err) {
            console.error(err);
            Shell.toast('Error converting ' + file.name + ': ' + err.message, 'error');
          }
        }

        convertBtn.disabled = false;
        convertBtn.innerHTML = 'Convert & Download';
        if (successCount > 0) Shell.toast(`Successfully converted ${successCount} images.`, 'success');
      };
    })();
  </script>
</body>
</html>
